# Self-host 3Dokploy:  docker compose up -d  →  http://localhost:3000
# Settings come from a .env file next to this one (see .env.example).
#
# Two backends, chosen with BACKEND:
#   dokploy (default)  DOKPLOY_URL and DOKPLOY_API_KEY are required.
#   docker             the proxy service reads the local Docker socket; no Dokploy needed:
#                      BACKEND=docker docker compose --profile docker up -d
services:
  # Read-only HTTP facade in front of the Docker socket. Only started with the "docker" profile.
  proxy:
    profiles: ["docker"]
    build: ./proxy
    restart: unless-stopped
    environment:
      LISTEN_ADDR: 0.0.0.0:3101
      DOCKER_SOCKET: /var/run/docker.sock
      ALLOW_CONTAINER_CONTROL: ${ALLOW_CONTAINER_CONTROL:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The socket is root:docker. Give the proxy's user that group instead of running it as root.
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env to the socket's group id (stat -c %g /var/run/docker.sock)}"
    # No ports: only 3dokploy reaches it, over the compose network.

  3dokploy:
    build: .
    # Or skip the build and use the published image:
    # image: ghcr.io/suleyman/3dokploy:latest
    restart: unless-stopped
    ports:
      # Dokploy itself listens on 3000: on the same machine, use e.g. "3100:3000".
      - "${HOST_PORT:-3000}:3000"
    environment:
      BACKEND: ${BACKEND:-dokploy}
      ALLOW_CONTAINER_CONTROL: ${ALLOW_CONTAINER_CONTROL:-false}
      DOCKER_PROXY_URL: http://proxy:3101
      DOKPLOY_URL: ${DOKPLOY_URL:-}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY:-}
      BASIC_AUTH: ${BASIC_AUTH:-}
    extra_hosts:
      # Lets DOKPLOY_URL=http://host.docker.internal:3000 reach a Dokploy on the same machine.
      - host.docker.internal:host-gateway
